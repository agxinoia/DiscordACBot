[package]
name = "eac-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "builder", "cache"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "io-util"] }
