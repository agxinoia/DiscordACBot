# Copy to config.toml and fill in. `EAC_CONFIG` overrides the path.

[discord]
# Prefer the DISCORD_TOKEN environment variable over putting the token here.
# token = "..."
channel_id = 123456789012345678  # replace with your channel id
# Register /eac to one guild for instant availability. Omit to register it
# globally, which can take up to an hour to propagate.
# guild_id = 123456789012345678

[tracker]
poll_interval_secs = 300
request_timeout_secs = 30
# Post an embed the first time a target is seen. Leave false so a fresh
# deployment does not fire one embed per configured target on startup.
announce_on_first_seen = false
# Attach the raw CDN response, split into parts under the size below.
attach_raw_response = true
max_attachment_bytes = 9500000
state_path = "state.json"
# thumbnail_url = "https://example.invalid/eac-logo.png"

# Product and deployment ids come from the game's EasyAntiCheat settings;
# the URL is https://modules-cdn.eac-prod.on.epicgames.com/modules/{product_id}/{deployment_id}/{platform}
[[games]]
name = "ARC Raiders"
product_id = "9e8b37541e614575b4de303d2c2e44cf"
deployment_id = "35e06571d8ab4de4b98519b624125459"
platforms = ["win64"]

